<!-- Light variant only. The original carried a prefers-color-scheme rule and a
     second icon for dark mode. An <img> resolves that against the browser's
     scheme, not the element behind it, and the logo always sits on a white
     chip — so in a dark-mode browser the dark variant swapped in and vanished.
     (Both variants are embedded PNGs; this is a wrapper, not a vector logo.) -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000"><svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000"><g><g transform="matrix(6.944444444444445,0,0,6.944444444444445,0,0)"><svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="144" height="144" viewBox="0 0 144 144"><image width="144" height="144" xlink:href="data:image/png;base64,"></image></svg></g></g></svg></svg>
