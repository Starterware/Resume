name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Required by actions/deploy-pages: id-token lets the deployment prove it came
# from this workflow run.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run validate

      - run: npm test

      # Only the headless shell is needed to print PDFs, which is a much
      # smaller download than the full Chromium build.
      - name: Install Chromium for PDF generation
        run: npx playwright install --with-deps --only-shell chromium

      # Builds the site, verifies every route was prerendered, then renders
      # the three PDFs from the /print routes into the same output directory.
      - run: npm run build:full

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/resume/browser
          # v4 stopped bundling dotfiles by default, which would drop .nojekyll.
          include-hidden-files: true

  deploy:
    # Pull requests are built and tested but never published.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
